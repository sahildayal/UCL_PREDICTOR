name: settle

# Runs the morning after each matchday. Settlement reads results from the same
# Wikipedia templates that supply fixtures, so it costs no Odds API credits.
on:
  schedule:
    - cron: "0 7 * * 3,4,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: ucl-cache-${{ github.run_id }}
          restore-keys: ucl-cache-
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/settle.py
      - name: Commit settled ledger
        run: |
          git config user.name "ucl-predictor"
          git config user.email "noreply@github.com"
          git add -f data/ledger/ledger.json docs/ data/processed/brief_*.json
          git diff --staged --quiet || git commit -m "settle $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
